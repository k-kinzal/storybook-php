name: Property-based tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: Optional ERIS_SEED from a failing run; leave empty to explore
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: "1"

jobs:
  pbt:
    name: Eris properties (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          extensions: dom, mbstring, pcntl, simplexml, xml, xmlwriter
          coverage: none
      - name: Select PHP 8.3 dependencies
        run: cp composer.lock.php-8.3 composer.lock
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true
      - name: Check installed platform requirements
        run: composer check-platform-reqs
      - name: Run the property-based tests
        env:
          ERIS_SEED: ${{ inputs.seed || '' }}
        run: |
          set -euo pipefail

          case "$ERIS_SEED" in
            ''|*[!0-9]*)
              if [ -n "$ERIS_SEED" ]; then
                echo 'seed must be empty or a non-negative integer.' >&2
                exit 2
              fi
              ;;
          esac

          composer test:pbt
