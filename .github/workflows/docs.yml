name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: "1"

jobs:
  build:
    name: Generate the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.5"
          extensions: dom, mbstring, pcntl, simplexml, xml, xmlwriter, gd
          coverage: pcov

      - name: Select the PHP 8.5 lock file
        run: cp composer.lock.php-8.5 composer.lock

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          dependency-versions: locked
          composer-options: --prefer-dist
          require-lock-file: true

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Restore the DocGen cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/docgen-cache
          key: docgen-${{ runner.os }}-${{ hashFiles('composer.lock') }}-${{ github.sha }}
          restore-keys: |
            docgen-${{ runner.os }}-${{ hashFiles('composer.lock') }}-
            docgen-${{ runner.os }}-

      - name: Generate the coverage report
        run: composer test:coverage

      - name: Generate the documentation
        run: |
          set -euo pipefail

          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          composer docgen -- \
            --base-url="https://${repository%%/*}.github.io/${repository#*/}"

      - name: Upload the documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: documentation
          path: build/docs
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Publish the documentation site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: .docs-branch

      - name: Download the documentation site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: documentation
          path: build/docs

      - name: Publish the site without removing pull request previews
        working-directory: .docs-branch
        run: |
          set -euo pipefail
          rsync -a --checksum --delete --exclude '/.git/' --exclude '/pr/' --exclude '/CNAME' ../build/docs/ ./
          touch .nojekyll
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --message "docs: generate from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi

      - name: Request and verify GitHub Pages publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          build_url="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq .url)"
          for attempt in {1..60}; do
            status="$(gh api "${build_url}" --jq .status)"
            case "${status}" in
              built) exit 0 ;;
              errored) gh api "${build_url}"; exit 1 ;;
            esac
            sleep 5
          done
          echo 'GitHub Pages publication timed out.' >&2
          exit 1
