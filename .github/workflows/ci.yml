name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
      - name: Select PHP 8.5 dependencies
        run: cp composer.lock.php-8.5 composer.lock
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Check PHP syntax
        run: composer lint:syntax
      - name: Check formatting
        run: composer format:check
      - name: Analyse contracts and types
        run: composer phpstan
      - name: Check PHP 8.0 compatibility
        run: composer compat
      - name: Check source complexity and length
        run: composer loc-guard
      - name: Check repository structure
        run: composer tree-guard
      - name: Audit dependencies
        run: composer audit:security
      - name: Check automated refactors
        run: composer rector

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Select PHP ${{ matrix.php }} dependencies
        run: cp composer.lock.php-${{ matrix.php }} composer.lock
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run unit tests in parallel
        run: composer test
      - name: Run executable documentation
        run: composer doctest

  php-coverage:
    name: PHP Coverage and Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: xdebug
      - name: Select PHP 8.5 dependencies
        run: cp composer.lock.php-8.5 composer.lock
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Enforce line coverage
        run: composer test:coverage
      - name: Generate API documentation
        run: composer doc-gen:fresh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
      - run: npm ci
      - name: Install Laravel example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/laravel
      - name: Install Symfony example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/symfony
      - name: Install CakePHP example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/cakephp
      - name: Install CodeIgniter example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/codeigniter
      - name: Install Nette example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/nette
      - name: Install Advanced patterns example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/advanced-patterns
      - run: npm test
