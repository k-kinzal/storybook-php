name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: npm ci
      - name: Install Laravel example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/laravel
      - name: Install Symfony example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/symfony
      - name: Install CakePHP example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/cakephp
      - name: Install CodeIgniter example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/codeigniter
      - name: Install Nette example dependencies
        if: matrix.php >= '8.2'
        run: composer install --no-interaction --prefer-dist --working-dir=examples/nette
      - run: npm test
