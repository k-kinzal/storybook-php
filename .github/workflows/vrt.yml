name: VRT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  vrt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: basic
            php: "8.4"
            pkg: npm-install
            composer: false
          - example: advanced-patterns
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: advanced-components
            php: "8.4"
            pkg: npm-install
            composer: false
          - example: advanced-callables
            php: "8.4"
            pkg: npm-install
            composer: false
          - example: advanced-templates
            php: "8.4"
            pkg: npm-install
            composer: false
          - example: laravel
            php: "8.4"
            pkg: pnpm
            composer: true
          - example: symfony
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: cakephp
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: codeigniter
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: nette
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: php80
            php: "8.0"
            pkg: npm-install
            composer: false
          - example: php81
            php: "8.1"
            pkg: npm-install
            composer: false
          - example: php82
            php: "8.2"
            pkg: npm-install
            composer: false
          - example: php83
            php: "8.3"
            pkg: npm-install
            composer: false
          - example: php84
            php: "8.4"
            pkg: pnpm
            composer: false
          - example: php85
            php: "8.5"
            pkg: npm-install
            composer: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php }}

      - name: Setup pnpm
        if: matrix.pkg == 'pnpm'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install Composer dependencies
        if: matrix.composer == true
        working-directory: examples/${{ matrix.example }}
        run: composer install --no-interaction --prefer-dist

      - name: Build storybook-php package
        run: npm ci && npm run build

      - name: Install Node dependencies (pnpm)
        if: matrix.pkg == 'pnpm'
        working-directory: examples/${{ matrix.example }}
        run: pnpm install --frozen-lockfile

      - name: Install Node dependencies (npm install)
        if: matrix.pkg == 'npm-install'
        working-directory: examples/${{ matrix.example }}
        run: npm install

      - name: Install Playwright browsers
        working-directory: examples/${{ matrix.example }}
        run: npx playwright install --with-deps chromium

      - name: Restore VRT baselines (PR)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: examples/${{ matrix.example }}/__vis__/linux/__baselines__
          key: vrt-v2-baselines-${{ matrix.example }}-${{ github.sha }}
          restore-keys: |
            vrt-v2-baselines-${{ matrix.example }}-

      - name: Run VRT (update baselines)
        if: github.event_name == 'push'
        working-directory: examples/${{ matrix.example }}
        run: npx vitest run --update

      - name: Run VRT (compare)
        if: github.event_name == 'pull_request'
        working-directory: examples/${{ matrix.example }}
        continue-on-error: true
        run: npx vitest run

      - name: Save VRT baselines (main)
        if: github.event_name == 'push'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: examples/${{ matrix.example }}/__vis__/linux/__baselines__
          key: vrt-v2-baselines-${{ matrix.example }}-${{ github.sha }}

      - name: Upload VRT results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-results-${{ matrix.example }}
          path: |
            examples/${{ matrix.example }}/__vis__/linux/__diffs__/
            examples/${{ matrix.example }}/__vis__/linux/__results__/
            examples/${{ matrix.example }}/__vis__/linux/__baselines__/
          if-no-files-found: ignore
          retention-days: 7

  vrt-report:
    needs: vrt
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts

      - name: Download all VRT results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vrt-results-*
          path: vrt-results
          merge-multiple: false

      - name: Generate HTML report
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x .github/scripts/generate-vrt-report.sh
          .github/scripts/generate-vrt-report.sh "${{ github.event.pull_request.number }}"

      - name: Upload HTML report
        if: hashFiles('vrt-report.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-report
          path: vrt-report.html

      - name: Comment on PR
        if: env.HAS_DIFFS == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const diffSummary = fs.readFileSync('diff-summary.md', 'utf8');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## 🔍 VRT: Visual diffs detected\n',
              diffSummary,
              `\n📎 [View VRT Report](${runUrl})`,
            ].join('\n');

            const marker = '<!-- vrt-report -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
