name: VRT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  vrt:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      VRT_BROWSER_WS_ENDPOINT: ws://127.0.0.1:6677/
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: basic
            php: "8.4"
            pkg: npm-install
            composer: false
          - example: advanced-patterns
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: advanced-components
            php: "8.4"
            pkg: npm-install
            composer: false
          - example: advanced-callables
            php: "8.4"
            pkg: npm-install
            composer: false
          - example: advanced-templates
            php: "8.4"
            pkg: npm-install
            composer: false
          - example: laravel
            php: "8.4"
            pkg: pnpm
            composer: true
          - example: symfony
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: cakephp
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: codeigniter
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: nette
            php: "8.4"
            pkg: npm-install
            composer: true
          - example: php80
            php: "8.0"
            pkg: npm-install
            composer: false
          - example: php81
            php: "8.1"
            pkg: npm-install
            composer: false
          - example: php82
            php: "8.2"
            pkg: npm-install
            composer: false
          - example: php83
            php: "8.3"
            pkg: npm-install
            composer: false
          - example: php84
            php: "8.4"
            pkg: pnpm
            composer: false
          - example: php85
            php: "8.5"
            pkg: npm-install
            composer: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          ini-values: date.timezone=UTC
          coverage: none

      - name: Setup pnpm
        if: matrix.pkg == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # renovate: datasource=npm depName=pnpm
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install Composer dependencies
        if: matrix.composer == true
        working-directory: examples/${{ matrix.example }}
        run: composer install --no-interaction --prefer-dist

      - name: Build storybook-php package
        run: npm ci && npm run build

      - name: Install Node dependencies (pnpm)
        if: matrix.pkg == 'pnpm'
        working-directory: examples/${{ matrix.example }}
        run: pnpm install --frozen-lockfile

      - name: Install Node dependencies (npm ci)
        if: matrix.pkg == 'npm-install'
        working-directory: examples/${{ matrix.example }}
        run: npm ci

      - name: Start pinned Playwright browser
        run: |
          image="$(node -p "require('./examples/_shared/vrt-environment.json').image")"
          docker run --detach --rm --init --ipc=host --platform linux/amd64 \
            --name vrt-browser --publish 127.0.0.1:6677:6677 \
            --volume "$GITHUB_WORKSPACE:/work:ro" "$image" \
            node /work/examples/${{ matrix.example }}/node_modules/playwright/cli.js \
            run-server --port 6677 --host 0.0.0.0
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 \
            http://127.0.0.1:6677/

      - name: Restore VRT baselines (PR)
        id: baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/${{ matrix.example }}/__vis__/linux/__baselines__
          key: vrt-v3-${{ matrix.example }}-${{ matrix.php }}-${{ hashFiles('examples/_shared/vrt-environment.json', 'examples/_shared/*.mjs') }}-${{ github.event.pull_request.base.sha || github.sha }}

      - name: Run VRT (update baselines)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: examples/${{ matrix.example }}
        run: npx vitest run --update

      # Visual diffs are reviewed via the VRT report and must not fail the PR,
      # but any other failure (PHP render errors, story exceptions, import
      # errors) would also fail on main, so it fails the PR too.
      - name: Run VRT (compare)
        id: compare
        if: github.event_name == 'pull_request'
        working-directory: examples/${{ matrix.example }}
        env:
          VRT_COMPARE: ${{ steps.baseline.outputs.cache-hit == 'true' }}
        run: |
          set +e
          npx vitest run --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/vrt-results.json" 2>&1 | tee "$RUNNER_TEMP/vrt-output.log"
          exit_code="${PIPESTATUS[0]}"
          set -e
          node "$GITHUB_WORKSPACE/.github/vrt/check-results.mjs" \
            "$exit_code" "$RUNNER_TEMP/vrt-results.json" "$RUNNER_TEMP/vrt-output.log"

      - name: Save VRT baselines (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/${{ matrix.example }}/__vis__/linux/__baselines__
          key: vrt-v3-${{ matrix.example }}-${{ matrix.php }}-${{ hashFiles('examples/_shared/vrt-environment.json', 'examples/_shared/*.mjs') }}-${{ github.event.pull_request.base.sha || github.sha }}

      - name: Record whether comparison completed
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p examples/${{ matrix.example }}/__vis__/linux
          echo "${{ steps.compare.outcome == 'success' && steps.baseline.outputs.cache-hit == 'true' }}" > examples/${{ matrix.example }}/__vis__/linux/compared.txt

      - name: Stop browser
        if: always()
        run: docker stop vrt-browser || true

      - name: Upload VRT results
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-results-${{ matrix.example }}
          path: |
            examples/${{ matrix.example }}/__vis__/linux/compared.txt
            examples/${{ matrix.example }}/__vis__/linux/__diffs__/
            examples/${{ matrix.example }}/__vis__/linux/__results__/
            examples/${{ matrix.example }}/__vis__/linux/__baselines__/
          if-no-files-found: ignore
          retention-days: 7

  vrt-report:
    needs: vrt
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/vrt

      - name: Download all VRT results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vrt-results-*
          path: vrt-results
          merge-multiple: false

      - name: Generate HTML report
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x .github/vrt/generate-report.sh
          .github/vrt/generate-report.sh "${{ github.event.pull_request.number }}"

      - name: Upload HTML report
        if: hashFiles('vrt-report.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-report
          path: vrt-report.html

      - name: Comment on PR
        if: hashFiles('diff-summary.md') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const diffSummary = fs.readFileSync('diff-summary.md', 'utf8');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## VRT comparison\n',
              diffSummary,
              `\n📎 [View VRT Report](${runUrl})`,
            ].join('\n');

            const marker = '<!-- vrt-report -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
