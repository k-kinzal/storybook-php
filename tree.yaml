paths:
  - ".github"
  - "src/php"
  - "tests/php"
  - "tests/Unit"
  - "tools/php"

exclude:
  - ".git"
  - ".phpstan"
  - ".phpunit.cache"
  - "build"
  - "node_modules"
  - "vendor"

rules:
  - path: "**"
    deny_dirs: ["scripts", "Scripts"]
    max_files: 15
    max_dirs: 20
  - path: "src/php"
    forbid_empty: true
    allow: ["*.php"]
    file_case: snake
    dir_case: pascal
  - path: "src/php/Runtime/**"
    forbid_empty: true
    allow: ["*.php"]
    file_case: pascal
    dir_case: pascal
  - path: "tests/Unit/php/Runtime/**"
    forbid_empty: true
    allow: ["*Test.php"]
    file_case: pascal
    dir_case: pascal
  - path: "tests/php"
    max_dirs: 20

report:
  reporter: ai
  order_by:
    - path
    - rule
